<div class="page-header">
  <div>
    <h1 class="page-title">Gestos</h1>
    <p class="page-subtitle">Administra tus gestos guardados</p>
  </div>
  <button class="btn-agregar">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    </svg>
    Agregar gesto
  </button>
</div>

<div class="search-wrapper">
  <svg class="search-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <circle cx="11" cy="11" r="8" />
    <line x1="21" y1="21" x2="16.65" y2="16.65" />
  </svg>
  <input class="search-input" type="text" placeholder="Search"
         [value]="searchQuery()"
         (input)="onSearch($any($event.target).value)" />
</div>

<div *ngIf="loading()" class="empty-state">
  <span class="empty-emoji">⏳</span>
  <p>Cargando gestos…</p>
</div>

<div *ngIf="error()" class="empty-state">
  <span class="empty-emoji">⚠️</span>
  <p>{{ error() }}</p>
</div>

<div class="gestos-grid" *ngIf="!loading()">
  <div class="gesto-card" *ngFor="let gesto of gestosFiltrados()">

    <div class="gesto-card-header">
      <span class="gesto-emoji">👋</span>
      <span class="badge"
            [class.badge-activo]="gesto.tipoDisparadorNombre === 'Activo'"
            [class.badge-pausado]="gesto.tipoDisparadorNombre === 'Pausado'">
        {{ gesto.tipoDisparadorNombre ?? '—' }}
      </span>
    </div>

    <h3 class="gesto-nombre">{{ gesto.nombreGesto }}</h3>

    <div class="gesto-accion">
      <p class="accion-label">ID IA</p>
      <p class="accion-valor">{{ gesto.identificadorIa }}</p>
    </div>

    <div class="gesto-accion">
      <p class="accion-label">Confianza mínima</p>
      <p class="accion-valor">{{ gesto.nivelConfianzaMinimo }}</p>
    </div>

    <div class="gesto-footer">
      <div class="gesto-actions">
        <button class="action-btn"
                [title]="gesto.tipoDisparadorNombre === 'Activo' ? 'Pausar' : 'Activar'"
                (click)="toggleEstado(gesto)">
          <svg *ngIf="gesto.tipoDisparadorNombre === 'Activo'" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <rect x="6" y="4" width="4" height="16" />
            <rect x="14" y="4" width="4" height="16" />
          </svg>
          <svg *ngIf="gesto.tipoDisparadorNombre !== 'Activo'" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polygon points="5 3 19 12 5 21 5 3" />
          </svg>
        </button>
        <button class="action-btn action-btn-danger" title="Eliminar" (click)="eliminarGesto(gesto.skGestoId)">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="3 6 5 6 21 6" />
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
            <path d="M10 11v6M14 11v6" />
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2" />
          </svg>
        </button>
      </div>
    </div>

  </div>

  <div class="empty-state" *ngIf="gestosFiltrados().length === 0 && !loading()">
    <span class="empty-emoji">🔍</span>
    <p>No se encontraron gestos</p>
  </div>
</div>
