<div class="dashboard-wrapper">


  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
        <img src="/icons/logo.svg" class="logo-icon" alt="Logo">
      <div class="logo-text">
        <span class="logo-name">Manordomo</span>
        <!-- <span class="logo-sub">Smart Home</span> -->
      </div>
    </div>

   <nav class="sidebar-nav">
  <a class="nav-item" routerLink="/dashboard/inicio" routerLinkActive="active">
    <img src="/icons/layout-dashboard.svg" class="nav-icon-img" alt="Dashboard">
    <span class="nav-text">Dashboard</span>
  </a>

  <a class="nav-item" routerLink="/dashboard/dispositivos" routerLinkActive="active">
    <img src="/icons/smartphone.svg" class="nav-icon-img" alt="Dispositivos">
    <span class="nav-text">Dispositivos</span>
  </a>

  <a class="nav-item" routerLink="/dashboard/gestos" routerLinkActive="active">
    <img src="/icons/hand.svg" class="nav-icon-img" alt="Gestos">
    <span class="nav-text">Gestos</span>
  </a>

  <a class="nav-item" routerLink="/dashboard/historial" routerLinkActive="active">
    <img src="/icons/clock.svg" class="nav-icon-img" alt="Historial de actividad">
    <span class="nav-text">Historial de actividad</span>
  </a>

  <a class="nav-item" routerLink="/dashboard/control" routerLinkActive="active">
    <img src="/icons/pencil.svg" class="nav-icon-img" alt="Control">
    <span class="nav-text">Control</span>
  </a>
</nav>

<div class="sidebar-bottom">
  <a class="nav-item" routerLink="/dashboard/ajustes" routerLinkActive="active">
    <img src="/icons/bolt.svg" class="nav-icon-img" alt="Ajustes">
    <span class="nav-text">Ajustes</span>
  </a>

  <a class="nav-item" routerLink="/dashboard/cuenta" routerLinkActive="active">
    <img src="/icons/user.svg" class="nav-icon-img" alt="Cuenta">
    <span class="nav-text">Cuenta</span>
  </a>

  <a class="nav-item signout" (click)="onLogout()" style="cursor: pointer;">
    <img src="/icons/log-out.svg" class="nav-icon-img" alt="Salir">
    <span class="nav-text">Salir</span>
  </a>
</div>
  </aside>

  <main class="dashboard-main">
    <router-outlet />
  </main>

</div>
