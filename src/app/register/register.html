<div class="auth-background">
  <div class="auth-card">
    <div class="auth-left">
      
      <div class="auth-header">
        <img src="icono_manordomo.png" alt="logo mini" class="logo-mini"/>
        <span class="brand-name">manordomo</span>
      </div>

      <h1>Bienvenido a<br><span>manordomo</span></h1>
      <p class="auth-subtitle">Crea tu cuenta para comenzar.</p>

      <div class="field">
        <label>Nombre y apellido</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          <input type="text" placeholder="Ej. Juan Pérez" [(ngModel)]="nombre" (keypress)="soloLetras($event)"/>
        </div>
      </div>

      <div class="field">
        <label>Email</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><rect x="2" y="4" width="20" height="16" rx="2" ry="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
          <input type="email" placeholder="ejemplo@email.com" [(ngModel)]="correo"/>
        </div>
      </div>

      <div class="field">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <div class="password-wrapper">
            <input
              [type]="showPassword() ? 'text' : 'password'"
              placeholder="Al menos 8 caracteres"
              [(ngModel)]="contrasenia"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePassword()">
              <svg *ngIf="!showPassword()" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="showPassword()" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.77 21.77 0 0 1 5.06-6.94"/><path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.17 4.31"/><path d="M1 1l22 22"/></svg>
            </button>
          </div>
        </div>
      </div>

      <button class="btn-primary" (click)="onRegister()">
        Crear cuenta
      </button>

      <p class="login-link">¿Ya tienes una cuenta? <a routerLink="/">Inicia sesión</a></p>

      <footer>
        <p>© 2026 Todos los derechos reservados</p>
      </footer>

    </div>

    <div class="auth-right">
      <div class="deco-wave"></div>
      <img src="lago.png" alt="logo grande" class="logo-large" />
    </div>
  </div>
</div>
