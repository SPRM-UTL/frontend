<div class="login-wrapper">
  <div class="login-left">
    <div class="login-box">
      <h1>Bienvenido a<br><span>manordomo</span></h1>

      <div class="field">
        <label>Email</label>
        <div class="input-wrapper">
          <svg lucideMail class="input-icon" style="width: 20px; height: 20px;"></svg>
          <input type="email" placeholder="ejemplo@email.com" [(ngModel)]="correo"/>
        </div>
      </div>

<div class="field">

  <label>Contraseña</label>

  <div class="input-wrapper">

    <svg lucideLock class="input-icon" style="width: 20px; height: 20px;"></svg>

    <div class="password-wrapper">

      <input
        [type]="showPassword() ? 'text' : 'password'"
        placeholder="Al menos 8 caracteres"
        [(ngModel)]="contrasenia"
      />

      <button
        type="button"
        class="toggle-password"
        (click)="togglePassword()">

        @if (!showPassword()) {
          <svg
            lucideEye
            style="width: 22px; height: 22px;">
          </svg>
        } @else {
          <svg
            lucideEyeOff
            style="width: 22px; height: 22px;">
          </svg>
        }

      </button>

    </div>

  </div>

  <a class="forgot" href="#">
    ¿Olvidaste tu contraseña?
  </a>

</div>      <button class="btn-primary" (click)="onLogin()">
        <svg lucideLogIn style="width: 20px; height: 20px; margin-right: 8px; vertical-align: middle;"></svg>
        Ingresar
      </button>

      <p class="register">¿No tienes una cuenta? <a routerLink="/register">Regístrate</a></p>
    </div>

    <footer>© 2026 Todos los derechos reservados</footer>
  </div>

  <div class="login-right">
    <img src="lago.png" alt="logo" class="logo-img" />
  </div>
</div>
