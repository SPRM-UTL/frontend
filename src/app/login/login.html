<div class="login-wrapper">
  <div class="login-left">
    <div class="login-box">
      <h1>Bienvenido a<br><span>manordomo</span></h1>

      <div class="field">
        <label>Email</label>
        <div class="input-wrapper">
          <svg lucideMail class="input-icon" style="width: 20px; height: 20px;"></svg>
          <input type="email" placeholder="ejemplo@email.com" [(ngModel)]="correo"/>
        </div>
      </div>

<div class="field">

  <label>Contraseña</label>

  <div class="input-wrapper">

    <svg lucideLock class="input-icon" style="width: 20px; height: 20px;"></svg>

    <div class="password-wrapper">

      <input
        [type]="showPassword() ? 'text' : 'password'"
        placeholder="Al menos 8 caracteres"
        [(ngModel)]="contrasenia"
      />

      <button
        type="button"
        class="toggle-password"
        (click)="togglePassword()">

        @if (!showPassword()) {
          <svg
            lucideEye
            style="width: 22px; height: 22px;">
          </svg>
        } @else {
          <svg
            lucideEyeOff
            style="width: 22px; height: 22px;">
          </svg>
        }

      </button>

    </div>

  </div>

  <a class="forgot" href="#">
    ¿Olvidaste tu contraseña?
  </a>

</div>



      <button class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" />
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" />
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z" />
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" />
        </svg>
        Ingresar con Google
      </button>

      <p class="register">¿No tienes una cuenta? <a routerLink="/register">Regístrate</a></p>
    </div>

    <footer>© 2026 Todos los derechos reservados</footer>
  </div>

  <div class="login-right">
    <img src="lago.png" alt="logo" class="logo-img" />
  </div>
</div>
