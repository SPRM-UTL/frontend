<div class="login-wrapper" id="teal-mode">
  <div class="login-left">
    <div class="login-box">
      <h1>Bienvenido a<br><span>manordomo</span></h1>

      <div class="field">
        <label>Email</label>
        <input type="email" placeholder="ejemplo@email.com" [(ngModel)]="correo"/>
      </div>

<div class="field">

  <label>Contraseña</label>

  <div class="password-wrapper">

    <input
      [type]="showPassword() ? 'text' : 'password'"
      placeholder="Al menos 8 caracteres"
      [(ngModel)]="contrasenia"
    />

    <button
      type="button"
      class="toggle-password"
      (click)="togglePassword()">

      <!-- OJO ABIERTO -->
      <svg
        *ngIf="!showPassword()"
        xmlns="http://www.w3.org/2000/svg"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>

      <!-- OJO CERRADO -->
      <svg
        *ngIf="showPassword()"
        xmlns="http://www.w3.org/2000/svg"
        width="22"
        height="22"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2">

        <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20C5 20 1 12 1 12a21.77 21.77 0 0 1 5.06-6.94"/>
        <path d="M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.17 4.31"/>
        <path d="M1 1l22 22"/>

      </svg>

    </button>

  </div>

  <a class="forgot" href="#">
    ¿Olvidaste tu contraseña?
  </a>

</div>
      
      <button class="btn-primary" (click)="onLogin()">Ingresar</button>

      <div class="divider"><span>Ó</span></div>

      <button class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z" />
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z" />
          <path fill="#FBBC05" d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957C.347 6.175 0 7.55 0 9s.348 2.825.957 4.039l3.007-2.332z" />
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" />
        </svg>
        Ingresar con Google
      </button>

      <p class="register">¿No tienes una cuenta? <a routerLink="/register">Regístrate</a></p>
    </div>

    <footer>© 2026 Todos los derechos reservados</footer>
  </div>

  <div class="login-right">
    <img src="lago.png" alt="logo" class="logo-img" />
  </div>
</div>
