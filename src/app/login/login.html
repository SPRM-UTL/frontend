<div class="auth-background">
  <div class="auth-card">
    <div class="auth-left">

      <div class="auth-header">
        <img src="icono_manordomo.svg" alt="logo mini" class="logo-mini"/>
        <span class="brand-name">manordomo</span>
      </div>

      <h1>Bienvenido a<br><span>manordomo</span></h1>
      <p class="auth-subtitle">Ingresa a tu cuenta para continuar.</p>

      <div class="field">
        <label>Email</label>
        <div class="input-wrapper">
          <svg lucideMail class="input-icon" style="width: 20px; height: 20px;"></svg>
          <input type="email" placeholder="ejemplo@email.com" [(ngModel)]="correo" (keydown.enter)="passwordInput.focus()"/>
        </div>
      </div>

      <div class="field">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <svg lucideLock class="input-icon" style="width: 20px; height: 20px;"></svg>
          <div class="password-wrapper">
            <input
            #passwordInput
              [type]="showPassword() ? 'text' : 'password'"
              placeholder="Al menos 8 caracteres"
              [(ngModel)]="contrasenia"
              (keydown.enter)="onLogin()"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="togglePassword()">
              @if (!showPassword()) {
                <svg lucideEye style="width: 22px; height: 22px;"></svg>
              } @else {
                <svg lucideEyeOff style="width: 22px; height: 22px;"></svg>
              }
            </button>
          </div>
        </div>
      </div>

      <button class="btn-primary" (click)="onLogin()">
        Iniciar sesión
      </button>

      <div style="text-align: center; margin: 15px 0; color: #666; font-size: 14px;">
        o
      </div>

      <div class="custom-google-wrapper">
        <button type="button" class="btn-primary custom-google-btn">
          <svg viewBox="0 0 24 24" width="20" height="20" style="margin-right: 8px; fill: currentColor;">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Acceder con Google
        </button>

        <div class="google-overlay">
          <asl-google-signin-button type="standard" size="large" [width]="400"></asl-google-signin-button>
        </div>
      </div>

      <p class="register-link">¿No tienes una cuenta? <a routerLink="/register">Regístrate</a></p>

      <footer>
        <p>© 2026 Todos los derechos reservados</p>
      </footer>

    </div>

    <div class="auth-right">
      <div class="deco-wave"></div>
      <img src="lago.png" alt="logo grande" class="logo-large" />
    </div>
  </div>
</div>
