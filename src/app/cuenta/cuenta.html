<!-- cuenta.html — interfaz estilo Apple/Moderno -->

<div class="page-header">
  <p class="page-subtitle">Administra tu cuenta y preferencias</p>
</div>

<div class="cuenta-wrapper">
  <!-- Perfil Principal Card -->
  <div class="profile-card">
    <div class="profile-main">
      <div class="avatar-container">
        <div class="avatar-circle">
          <span class="icon-mask" style="mask-image: url('/icons/user.svg'); -webkit-mask-image: url('/icons/user.svg');"></span>
        </div>
        <button class="avatar-edit-btn" (click)="onEditAvatar()" aria-label="Editar avatar">
          <span class="icon-mask" style="mask-image: url('/icons/pencil.svg'); -webkit-mask-image: url('/icons/pencil.svg');"></span>
        </button>
      </div>
      <div class="profile-info">
        <h2>{{ userName() }}</h2>
        <p>Usuario • Smart Home</p>
      </div>
    </div>
    <div class="profile-arrow">
      <span class="icon-mask chevron-right"></span>
    </div>
  </div>

  <h3 class="section-title">Información de la cuenta</h3>

  <div class="info-list">
    <!-- Nombres -->
    <div class="info-item" [class.editing]="editingField() === 'nombre'">
      <div class="info-icon">
        <span class="icon-mask" style="mask-image: url('/icons/user.svg'); -webkit-mask-image: url('/icons/user.svg');"></span>
      </div>
      <div class="info-content">
        <label>Nombres</label>
        <div class="info-value" *ngIf="editingField() !== 'nombre'">{{ userName() }}</div>
        <input *ngIf="editingField() === 'nombre'"
               class="info-input"
               type="text"
               [(ngModel)]="editValue"
               (keydown.enter)="saveField('nombre')"
               (keydown.escape)="cancelEdit()"
               [disabled]="isSaving()"
               autoFocus />
      </div>
      <div class="info-actions">
        <button class="edit-pill-btn" *ngIf="editingField() !== 'nombre'" (click)="startEdit('nombre', userName() || '')" aria-label="Editar nombre">
          <span class="icon-mask" style="mask-image: url('/icons/pencil.svg'); -webkit-mask-image: url('/icons/pencil.svg');"></span>
        </button>
        <div class="save-cancel" *ngIf="editingField() === 'nombre'">
          <button class="btn-save" (click)="saveField('nombre')" [disabled]="isSaving()">
            {{ isSaving() ? '...' : 'Guardar' }}
          </button>
          <button class="btn-cancel" (click)="cancelEdit()" [disabled]="isSaving()">Cancelar</button>
        </div>
      </div>
    </div>

    <!-- Correo -->
    <div class="info-item" [class.editing]="editingField() === 'correo'">
      <div class="info-icon">
        <span class="icon-mask" style="mask-image: url('/icons/user.svg'); -webkit-mask-image: url('/icons/user.svg');"></span>
      </div>
      <div class="info-content">
        <label>Correo</label>
        <div class="info-value email" *ngIf="editingField() !== 'correo'">{{ userEmail() }}</div>
        <input *ngIf="editingField() === 'correo'"
               class="info-input"
               type="email"
               [(ngModel)]="editValue"
               (keydown.enter)="saveField('correo')"
               (keydown.escape)="cancelEdit()"
               [disabled]="isSaving()" />
      </div>
      <div class="info-actions">
        <button class="edit-pill-btn" *ngIf="editingField() !== 'correo'" (click)="startEdit('correo', userEmail() || '')" aria-label="Editar correo">
          <span class="icon-mask" style="mask-image: url('/icons/pencil.svg'); -webkit-mask-image: url('/icons/pencil.svg');"></span>
        </button>
        <div class="save-cancel" *ngIf="editingField() === 'correo'">
          <button class="btn-save" (click)="saveField('correo')" [disabled]="isSaving()">
            {{ isSaving() ? '...' : 'Guardar' }}
          </button>
          <button class="btn-cancel" (click)="cancelEdit()" [disabled]="isSaving()">Cancelar</button>
        </div>
      </div>
    </div>

    <!-- Contraseña -->
    <div class="info-item" [class.editing]="editingField() === 'password'">
      <div class="info-icon">
        <span class="icon-mask" style="mask-image: url('/icons/lock.svg'); -webkit-mask-image: url('/icons/lock.svg');"></span>
      </div>
      <div class="info-content">
        <label>Contraseña</label>
        <div class="info-value dots" *ngIf="editingField() !== 'password'">••••••••••••</div>
        <input *ngIf="editingField() === 'password'"
               class="info-input"
               type="password"
               [(ngModel)]="editValue"
               placeholder="Nueva contraseña"
               (keydown.enter)="saveField('password')"
               (keydown.escape)="cancelEdit()"
               [disabled]="isSaving()" />
      </div>
      <div class="info-actions">
        <button class="edit-pill-btn" *ngIf="editingField() !== 'password'" (click)="startEdit('password', '')" aria-label="Editar contraseña">
          <span class="icon-mask" style="mask-image: url('/icons/pencil.svg'); -webkit-mask-image: url('/icons/pencil.svg');"></span>
        </button>
        <div class="save-cancel" *ngIf="editingField() === 'password'">
          <button class="btn-save" (click)="saveField('password')" [disabled]="isSaving()">
            {{ isSaving() ? '...' : 'Guardar' }}
          </button>
          <button class="btn-cancel" (click)="cancelEdit()" [disabled]="isSaving()">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Logout Banner -->
  <div class="privacy-banner logout-banner">
    <div class="banner-left">
      <div class="banner-icon logout-icon">
        <span class="icon-mask" style="mask-image: url('/icons/log-out.svg'); -webkit-mask-image: url('/icons/log-out.svg');"></span>
      </div>
      <div class="banner-text">
        <h4>¿Deseas salir de tu cuenta?</h4>
        <p>Tu sesión se cerrará de forma segura en este dispositivo.</p>
      </div>
    </div>
    <button class="banner-btn logout-btn" (click)="onLogout()">
      Cerrar sesión
      <span class="icon-mask arrow-right"></span>
    </button>
  </div>

</div>
