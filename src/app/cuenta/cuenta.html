<div class="dashboard-wrapper">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">
        <img src="lago.png" alt="logo" />
      </div>
      <div class="logo-text">
        <span class="logo-name">Manordomo</span>
        <span class="logo-sub">Smart Home</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a class="nav-item" [class.active]="activeNav === 'dashboard'" (click)="setActive('dashboard')" routerLink="/dashboard">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <rect x="3" y="3" width="7" height="7" rx="1" />
          <rect x="14" y="3" width="7" height="7" rx="1" />
          <rect x="3" y="14" width="7" height="7" rx="1" />
          <rect x="14" y="14" width="7" height="7" rx="1" />
        </svg>
        Dashboard
      </a>
      <a class="nav-item" [class.active]="activeNav === 'dispositivos'" (click)="setActive('dispositivos')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" />
        </svg>
        Dispositivos
      </a>
      <a class="nav-item" [class.active]="activeNav === 'gestos'" (click)="setActive('gestos')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v0M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8" />
          <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" />
        </svg>
        Gestos
      </a>
      <a class="nav-item" [class.active]="activeNav === 'historial'" (click)="setActive('historial')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        Historial de actividad
      </a>
      <a class="nav-item" [class.active]="activeNav === 'control'" (click)="setActive('control')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M12 20h9" />
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
        </svg>
        Control
      </a>
    </nav>

    <div class="sidebar-bottom">
      <a class="nav-item" [class.active]="activeNav === 'ajustes'" (click)="setActive('ajustes')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        Ajustes
      </a>
      <a class="nav-item active" [class.active]="activeNav === 'cuenta'" (click)="setActive('cuenta')">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        Cuenta
      </a>
      <a class="nav-item signout" routerLink="/">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
        Salir
      </a>
    </div>
  </aside>

  <!-- ── MAIN ── -->
  <main class="dashboard-main">
    <div class="page-header">
      <h1 class="page-title">Cuenta</h1>
      <p class="page-subtitle">Administra tu cuenta</p>
    </div>

    <!-- Profile card -->
    <div class="cuenta-container">

      <!-- Avatar section -->
      <div class="avatar-section">
        <div class="avatar-wrapper">
          <div class="avatar-circle">
            <svg width="52" height="52" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="1.5" viewBox="0 0 24 24">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
          <button class="avatar-edit-btn" (click)="onEditAvatar()">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
            </svg>
          </button>
        </div>
        <div class="avatar-info">
          <span class="avatar-name">{{ userName }}</span>
          <span class="avatar-role">Usuario · Smart Home</span>
        </div>
      </div>

      <!-- Fields -->
      <div class="fields-section">

        <!-- Nombre -->
        <div class="field-card" [class.editing]="editingField === 'nombre'">
          <div class="field-label">Nombres</div>
          <div class="field-body">
            <div class="field-value" *ngIf="editingField !== 'nombre'">{{ userName }}</div>
            <input *ngIf="editingField === 'nombre'"
                   class="field-input"
                   type="text"
                   [(ngModel)]="editValue"
                   (keydown.enter)="saveField('nombre')"
                   (keydown.escape)="cancelEdit()"
                   #inputRef />
            <div class="field-actions">
              <button class="field-btn-icon" *ngIf="editingField !== 'nombre'" (click)="startEdit('nombre', userName)">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                </svg>
              </button>
              <div class="save-cancel" *ngIf="editingField === 'nombre'">
                <button class="btn-save" (click)="saveField('nombre')">Guardar</button>
                <button class="btn-cancel" (click)="cancelEdit()">Cancelar</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Correo -->
        <div class="field-card" [class.editing]="editingField === 'correo'">
          <div class="field-label">Correo</div>
          <div class="field-body">
            <div class="field-value email-value" *ngIf="editingField !== 'correo'">{{ userEmail }}</div>
            <input *ngIf="editingField === 'correo'"
                   class="field-input"
                   type="email"
                   [(ngModel)]="editValue"
                   (keydown.enter)="saveField('correo')"
                   (keydown.escape)="cancelEdit()" />
            <div class="field-actions">
              <button class="field-btn-icon" *ngIf="editingField !== 'correo'" (click)="startEdit('correo', userEmail)">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                </svg>
              </button>
              <div class="save-cancel" *ngIf="editingField === 'correo'">
                <button class="btn-save" (click)="saveField('correo')">Guardar</button>
                <button class="btn-cancel" (click)="cancelEdit()">Cancelar</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Contraseña -->
        <div class="field-card" [class.editing]="editingField === 'password'">
          <div class="field-label">Contraseña</div>
          <div class="field-body">
            <div class="field-value password-dots" *ngIf="editingField !== 'password'">
              ●●●●●●●●●●●●●●●●
            </div>
            <input *ngIf="editingField === 'password'"
                   class="field-input"
                   type="password"
                   [(ngModel)]="editValue"
                   placeholder="Nueva contraseña"
                   (keydown.enter)="saveField('password')"
                   (keydown.escape)="cancelEdit()" />
            <div class="field-actions">
              <button class="field-btn-icon" *ngIf="editingField !== 'password'" (click)="startEdit('password', '')">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                  <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                </svg>
              </button>
              <div class="save-cancel" *ngIf="editingField === 'password'">
                <button class="btn-save" (click)="saveField('password')">Guardar</button>
                <button class="btn-cancel" (click)="cancelEdit()">Cancelar</button>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Toast notification -->
      <div class="toast" [class.toast-visible]="toastVisible">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12" />
        </svg>
        Cambios guardados correctamente
      </div>

    </div>
  </main>
</div>
